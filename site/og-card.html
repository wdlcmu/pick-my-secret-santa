<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card render source — not a site page</title>
<style>

  body{width:1200px;height:630px;background:#fdf9f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}

  .scene{width:400px;flex:0 0 auto}
  h1{font-size:64px;line-height:1.08;color:#2a2118;letter-spacing:-0.02em}
  p{font-size:30px;color:#71634f;margin-top:18px;line-height:1.3}
  .brand{font-size:26px;font-weight:800;color:#17603c;margin-bottom:20px}
</style>
</head>
<body>
<div class="card">

    <rect x="101" y="78" width="18" height="72" fill="#fdf9f0"/>
    <rect x="46" y="64" width="128" height="18" rx="8" fill="#9c1f24"/>

    <circle cx="88" cy="112" r="5.5" fill="#fdf9f0"/>

    <circle cx="34" cy="120" r="7" fill="#d9a441"/>
    <circle cx="188" cy="104" r="6" fill="#17603c"/>
    <circle cx="180" cy="140" r="5" fill="#d9a441"/>
    <circle cx="40" cy="86" r="5" fill="#17603c"/>

  <div>
    <div class="brand">Pick My Secret Santa</div>
    <h1>Draw Secret Santa names in secret.</h1>
    <p>Free, no sign-up. Add names and a budget. About 2 minutes.</p>
  </div>
</div>
</body>
</html>
